[project]
name = "hangar-cv-optimizer"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "geffaa", email = "yodhimasgeffananda@mail.ugm.ac.id" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "ortools>=9.15.6755",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "shapely>=2.1.2",
    "ultralytics>=8.4.121",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
hangar-cv-optimizer = "hangar_cv_optimizer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.165.10",
    "pytest>=9.1.1",
]
